server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/edu_analysis?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# JWT 配置
jwt:
  # 密钥(生产环境请修改)
  secret: edu-analysis-secret-key-2024-spring-boot-vue-machine-learning
  # 过期时间(毫秒) 24小时
  expire: 86400000
  # 请求头名称
  header: Authorization
  # 令牌前缀
  prefix: "Bearer "
